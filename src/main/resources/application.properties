spring.application.name=nezafi
server.port=8082

# Identifiants de base de données jamais en clair ici — variables d'environnement (voir .env,
# jamais committé), avec des valeurs par défaut qui reproduisent le H2 local actuel si elles ne
# sont pas définies. Prêt pour la bascule PostgreSQL à venir : il suffira de positionner DB_URL/
# DB_USERNAME/DB_PASSWORD (et de retirer driver-class-name, spécifique à H2) sans toucher au code.
# Voir docs/postgresql-migration.md pour les préconisations sur le compte et l'accès réseau.
spring.datasource.url=${DB_URL:jdbc:h2:mem:nezafi;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

logging.level.org.springframework.security=INFO
anthropic.api.key=${ANTHROPIC_API_KEY}

# Stockage local des fichiers uploadés (photos d'emplacements, factures de contrat) :
# un simple dossier sur disque, pas de service de stockage externe pour cette première version.
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
