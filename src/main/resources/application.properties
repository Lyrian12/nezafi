spring.application.name=nezafi
server.port=8082

# Identifiants de base de données jamais en clair ici — variables d'environnement (voir .env,
# jamais committé). PostgreSQL est la base d'exécution réelle depuis la bascule (H2 ne sert plus
# qu'aux tests, cf. le profil "test" dans src/test/resources/application-test.properties) : le
# driver et le dialecte sont détectés automatiquement depuis l'URL JDBC, plus besoin de les fixer
# explicitement comme pour H2.
# Les valeurs par défaut ci-dessous correspondent à l'instance locale documentée dans
# docs/postgresql-migration.md (rôle nezafi_app, base nezafi) — DB_PASSWORD n'a volontairement
# aucun défaut, à définir explicitement.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nezafi}
spring.datasource.username=${DB_USERNAME:nezafi_app}
spring.datasource.password=${DB_PASSWORD:}

# Le schéma est géré par Flyway (src/main/resources/db/migration) depuis la bascule PostgreSQL —
# Hibernate ne fait plus que valider que les entités correspondent au schéma réel, il ne le
# modifie jamais lui-même. Ne pas repasser à "update" : ça contournerait Flyway silencieusement.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

logging.level.org.springframework.security=INFO
anthropic.api.key=${ANTHROPIC_API_KEY}

# Stockage local des fichiers uploadés (photos d'emplacements, factures de contrat) :
# un simple dossier sur disque, pas de service de stockage externe pour cette première version.
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
