<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Mon compte</title>
    <th:block th:replace="~{fragments/theme :: head}"></th:block>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased min-h-screen">

<div th:replace="~{fragments/admin-nav :: logoutDock}"></div>

<!-- CONTENU PRINCIPAL -->
<main class="max-w-4xl mx-auto p-6 md:p-10 my-6 md:my-10 bg-white dark:bg-slate-900 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-800 animate-panel-in">
    <!-- Top bar -->
    <div class="flex justify-end items-center mb-8 gap-3">
        <div th:replace="~{fragments/admin-nav :: panelClose}"></div>
        <div th:replace="~{fragments/admin-nav :: globalSearch}"></div>
        <div th:replace="~{fragments/theme :: toggleButton}"></div>
    </div>

    <!-- En-tête -->
    <div class="mb-8">
        <h1 class="text-3xl font-extrabold text-slate-900 dark:text-slate-100 tracking-tight mt-4">Mon compte</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Modifiez vos propres informations, y compris votre mot de passe.</p>
    </div>

    <!-- Formulaire -->
    <div class="max-w-2xl">
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm p-8">

            <div th:if="${error}" class="p-3 bg-red-50 dark:bg-red-950/40 border border-red-100 dark:border-red-800 text-red-600 dark:text-red-300 text-xs rounded-xl mb-6">
                <span th:text="${error}">Erreur</span>
            </div>
            <div th:if="${succes}" class="p-3 bg-lime-50 dark:bg-lime-950/40 border border-lime-100 dark:border-lime-800 text-lime-700 dark:text-lime-300 text-xs rounded-xl mb-6">
                <span th:text="${succes}">Succès</span>
            </div>

            <form th:action="@{/admin/mon-compte}" method="post" class="space-y-6">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <!-- Nom et Prénom -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">Nom *</label>
                        <input type="text" name="nom" th:value="${membre.nom}" required
                               class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:border-slate-400 transition-colors">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">Prénom *</label>
                        <input type="text" name="prenom" th:value="${membre.prenom}" required
                               class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:border-slate-400 transition-colors">
                    </div>
                </div>

                <!-- Téléphone -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">Téléphone *</label>
                    <input type="tel" name="telephone" th:value="${membre.telephone}" required
                           class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:border-slate-400 transition-colors">
                </div>

                <!-- Email -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">Email</label>
                    <input type="email" name="email" th:value="${membre.email}"
                           class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:border-slate-400 transition-colors">
                    <p class="text-[11px] text-slate-400 dark:text-slate-500 mt-1.5">Facultatif — la connexion fonctionne aussi avec le téléphone.</p>
                </div>

                <!-- Mot de passe -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">Nouveau mot de passe</label>
                    <input type="password" name="password" placeholder="8 caractères minimum"
                           class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:border-slate-400 transition-colors">
                    <p class="text-[11px] text-slate-400 dark:text-slate-500 mt-1.5">Laissez vide pour conserver le mot de passe actuel.</p>
                </div>

                <!-- Buttons -->
                <div class="flex gap-4 pt-4">
                    <button type="submit" class="bg-[#ccff00] hover:bg-[#b8e600] text-slate-900 font-bold py-3 px-6 rounded-xl transition-colors text-sm">
                        Enregistrer
                    </button>
                    <a th:href="@{/admin/dashboard}" class="bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-900 dark:text-slate-100 font-bold py-3 px-6 rounded-xl transition-colors text-sm">
                        Annuler
                    </a>
                </div>

            </form>
        </div>
    </div>

</main>

</body>
</html>
