<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<body>

<!-- SIDEBAR — factorisée ici pour éviter de dupliquer la navigation (et son lien
     actif) dans chacune des pages admin. `active` identifie la page courante. -->
<aside th:fragment="sidebar(active)" class="w-64 bg-white border-r border-slate-200 flex flex-col justify-between p-6 fixed h-full z-10">
    <div>
        <!-- Logo -->
        <div class="flex items-center space-x-2 mb-10">
            <span class="inline-block w-3 h-3 bg-lime-500 rounded-full"></span>
            <span class="font-bold text-lg tracking-wider text-slate-900">NEZAFI</span>
        </div>
        <!-- Navigation -->
        <nav class="space-y-1">
            <a th:href="@{/admin/stores}" class="flex items-center px-4 py-3 text-sm rounded-xl transition-colors"
               th:classappend="${active == 'stores'} ? 'font-bold bg-slate-900 text-white' : 'font-medium text-slate-600 hover:bg-slate-100'">
                Gestion des emplacements
            </a>
            <a th:href="@{/admin/contracts}" class="flex items-center px-4 py-3 text-sm rounded-xl transition-colors"
               th:classappend="${active == 'contracts'} ? 'font-bold bg-slate-900 text-white' : 'font-medium text-slate-600 hover:bg-slate-100'">
                Gestion des contrats
            </a>
            <a th:href="@{/admin/clients}" class="flex items-center px-4 py-3 text-sm rounded-xl transition-colors"
               th:classappend="${active == 'clients'} ? 'font-bold bg-slate-900 text-white' : 'font-medium text-slate-600 hover:bg-slate-100'">
                Gestion des clients
            </a>
            <a th:href="@{/admin/echeances}" class="flex items-center px-4 py-3 text-sm rounded-xl transition-colors"
               th:classappend="${active == 'echeances'} ? 'font-bold bg-slate-900 text-white' : 'font-medium text-slate-600 hover:bg-slate-100'">
                Échéances
            </a>
            <a th:href="@{/admin/audit}" class="flex items-center px-4 py-3 text-sm rounded-xl transition-colors"
               th:classappend="${active == 'audit'} ? 'font-bold bg-slate-900 text-white' : 'font-medium text-slate-600 hover:bg-slate-100'">
                Journal d'audit
            </a>
        </nav>
    </div>
    <!-- Déconnexion -->
    <div>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="w-full text-left px-4 py-2 text-xs font-semibold text-red-600 hover:bg-red-50 rounded-xl transition-colors">
                Déconnexion
            </button>
        </form>
    </div>
</aside>

<!-- RECHERCHE GLOBALE — cherche à la fois dans emplacements, clients et contrats
     (/admin/search) et redirige vers la fiche correspondante. Distincte des filtres
     propres à chaque page, présente partout dans l'admin. -->
<div th:fragment="globalSearch" class="relative w-80" id="global-search-wrapper">
    <input type="text" id="global-search-input" autocomplete="off"
           placeholder="Rechercher un emplacement, un client, un contrat..."
           class="bg-white border border-slate-200 px-4 py-2 rounded-xl text-xs w-full focus:outline-none focus:border-slate-400">
    <div id="global-search-results"
         class="hidden absolute right-0 mt-2 w-96 bg-white border border-slate-200 rounded-xl shadow-lg z-20 overflow-hidden max-h-96 overflow-y-auto"></div>
    <script th:inline="javascript">
        (function () {
            var searchUrl = /*[[@{/admin/search}]]*/ '/admin/search';
            var input = document.getElementById('global-search-input');
            var results = document.getElementById('global-search-results');
            var timer = null;

            function echapper(texte) {
                var div = document.createElement('div');
                div.textContent = texte;
                return div.innerHTML;
            }

            function afficher(items) {
                if (!items || items.length === 0) {
                    results.innerHTML = '<p class="text-xs text-slate-400 px-4 py-3">Aucun résultat.</p>';
                    results.classList.remove('hidden');
                    return;
                }
                results.innerHTML = items.map(function (item) {
                    return '<a href="' + echapper(item.url) + '" class="block px-4 py-3 border-b border-slate-50 last:border-0 hover:bg-slate-50">'
                        + '<span class="inline-block text-[10px] font-bold uppercase text-slate-400 mr-2">' + echapper(item.type) + '</span>'
                        + '<span class="text-xs font-semibold text-slate-800">' + echapper(item.label) + '</span>'
                        + '</a>';
                }).join('');
                results.classList.remove('hidden');
            }

            input.addEventListener('input', function () {
                var terme = input.value.trim();
                clearTimeout(timer);
                if (terme.length < 2) {
                    results.classList.add('hidden');
                    return;
                }
                timer = setTimeout(function () {
                    fetch(searchUrl + '?q=' + encodeURIComponent(terme))
                        .then(function (res) { return res.json(); })
                        .then(afficher)
                        .catch(function () { results.classList.add('hidden'); });
                }, 250);
            });

            document.addEventListener('click', function (event) {
                if (!document.getElementById('global-search-wrapper').contains(event.target)) {
                    results.classList.add('hidden');
                }
            });
        })();
    </script>
</div>

</body>
</html>
