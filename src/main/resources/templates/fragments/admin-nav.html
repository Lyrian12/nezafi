<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<body>

<!-- Pas de sidebar : chaque fonctionnalité (emplacements/contrats/clients/échéances/audit)
     est une tuile du tableau de bord (~{admin-dashboard}) et sa page reste une navigation
     classique, habillée pour donner l'impression d'un panneau ouvert par-dessus le tableau
     de bord (cf. ~{fragments/theme} pour l'animation et ~{panelClose} ci-dessous pour en
     sortir). -->

<!-- Icône "retour au tableau de bord", dans la barre du haut de chaque page module
     (liste/formulaire/détail), à côté du bouton clair/sombre — même gabarit que lui pour
     former une paire cohérente au lieu de se chevaucher. Distincte du lien "← Retour aux X"
     déjà présent sur les formulaires/détails (lui reste interne au module, plus bas dans
     l'en-tête : les deux ne se chevauchent pas). -->
<a th:fragment="panelClose" th:href="@{/admin/dashboard}"
   class="w-10 h-10 flex items-center justify-center rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors shrink-0"
   title="Retour" aria-label="Retour">
    <span class="w-5 h-5" th:insert="~{fragments/icons :: arrowLeft}"></span>
</a>

<!-- Déconnexion — seule icône flottante en bas à gauche, présente sur le tableau de bord et
     chaque page module (remplace l'ancien bouton texte du bas de la sidebar). -->
<div th:fragment="logoutDock" class="fixed bottom-6 left-6 z-20">
    <form th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit"
                class="w-11 h-11 flex items-center justify-center rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-950/40 shadow-sm transition-colors"
                title="Déconnexion" aria-label="Déconnexion">
            <span class="w-5 h-5" th:insert="~{fragments/icons :: logout}"></span>
        </button>
    </form>
</div>

<!-- RECHERCHE GLOBALE — cherche à la fois dans emplacements, clients et contrats
     (/admin/search) et redirige vers la fiche correspondante. Distincte des filtres
     propres à chaque page, présente partout dans l'admin. -->
<div th:fragment="globalSearch" class="relative w-80" id="global-search-wrapper">
    <input type="text" id="global-search-input" autocomplete="off"
           placeholder="Rechercher un emplacement, un client, un contrat..."
           class="bg-white border border-slate-200 px-4 py-2 rounded-xl text-xs w-full focus:outline-none focus:border-slate-400">
    <div id="global-search-results"
         class="hidden absolute right-0 mt-2 w-96 bg-white border border-slate-200 rounded-xl shadow-lg z-20 overflow-hidden max-h-96 overflow-y-auto"></div>
    <script th:inline="javascript">
        (function () {
            var searchUrl = /*[[@{/admin/search}]]*/ '/admin/search';
            var input = document.getElementById('global-search-input');
            var results = document.getElementById('global-search-results');
            var timer = null;

            function echapper(texte) {
                var div = document.createElement('div');
                div.textContent = texte;
                return div.innerHTML;
            }

            function afficher(items) {
                if (!items || items.length === 0) {
                    results.innerHTML = '<p class="text-xs text-slate-400 px-4 py-3">Aucun résultat.</p>';
                    results.classList.remove('hidden');
                    return;
                }
                results.innerHTML = items.map(function (item) {
                    return '<a href="' + echapper(item.url) + '" class="block px-4 py-3 border-b border-slate-50 last:border-0 hover:bg-slate-50">'
                        + '<span class="inline-block text-[10px] font-bold uppercase text-slate-400 mr-2">' + echapper(item.type) + '</span>'
                        + '<span class="text-xs font-semibold text-slate-800">' + echapper(item.label) + '</span>'
                        + '</a>';
                }).join('');
                results.classList.remove('hidden');
            }

            input.addEventListener('input', function () {
                var terme = input.value.trim();
                clearTimeout(timer);
                if (terme.length < 2) {
                    results.classList.add('hidden');
                    return;
                }
                timer = setTimeout(function () {
                    fetch(searchUrl + '?q=' + encodeURIComponent(terme))
                        .then(function (res) { return res.json(); })
                        .then(afficher)
                        .catch(function () { results.classList.add('hidden'); });
                }, 250);
            });

            document.addEventListener('click', function (event) {
                if (!document.getElementById('global-search-wrapper').contains(event.target)) {
                    results.classList.add('hidden');
                }
            });
        })();
    </script>
</div>

</body>
</html>
