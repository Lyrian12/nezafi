<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de bord - Gestion des Emplacements</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS pour un design moderne -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Manrope', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } } };
    </script>
</head>
<body class="bg-[#faf8f5] text-slate-800 antialiased min-h-screen flex flex-col">

<!-- NAVBAR (Logo à gauche, Sign Out à droite, rien au milieu) -->
<header class="w-full bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
    <!-- Logo à gauche -->
    <div class="flex items-center space-x-2">
        <span class="inline-block w-3 h-3 bg-lime-500 rounded-full"></span>
        <span class="font-bold text-lg tracking-wider text-slate-900">NEZAFI</span>
    </div>

    <!-- Sign out à la droite -->
    <div>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="w-9 h-9 flex items-center justify-center rounded-xl text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-colors"
                    title="Déconnexion" aria-label="Déconnexion">
                <span class="w-5 h-5" th:insert="~{fragments/icons :: logout}"></span>
            </button>
        </form>
    </div>
</header>

<!-- CONTENU PRINCIPAL -->
<main class="flex-grow max-w-7xl w-full mx-auto px-6 py-8">

    <!-- En-tête de bienvenue en français -->
    <div class="mb-8">
        <p class="text-xs font-semibold tracking-wider text-slate-400 uppercase mb-1">Bienvenue</p>
        <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight" th:text="${username} + '.'">Votre Tableau de Bord.</h1>
    </div>

    <!-- Total emplacements -->
    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm mb-10 max-w-xs">
        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Total Emplacements</p>
        <p class="text-3xl font-bold text-slate-900" th:text="${shops.size()}">01</p>
    </div>

    <!-- SECTION CENTRALE : LISTE DES EMPLACEMENTS -->
    <div class="space-y-6">
        <div class="flex items-center justify-between">
            <h2 class="text-xl font-bold text-slate-900">Vos Emplacements</h2>
            <span class="text-xs text-slate-400" th:text="'Affichage de ' + ${shops.size()} + ' emplacement(s)'">Affichage de 1 emplacement</span>
        </div>

        <!-- Grille des emplacements connectée aux vraies données -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div th:each="shop : ${shops}" class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex hover:border-slate-300 hover:shadow-md transition-all">

                <!-- Image en aside, étirée sur toute la hauteur de la carte quel que soit son format -->
                <div class="w-32 sm:w-40 shrink-0 self-stretch relative bg-slate-100">
                    <img th:if="${couvertureParEmplacementId.get(shop.id) != null}" th:src="${couvertureParEmplacementId.get(shop.id)}"
                         alt="Image de l'emplacement" class="absolute inset-0 w-full h-full object-cover">
                    <div th:if="${couvertureParEmplacementId.get(shop.id) == null}" class="absolute inset-0 flex items-center justify-center text-slate-300 text-[10px] font-semibold">
                        Aucune photo
                    </div>
                </div>

                <!-- Informations -->
                <div class="flex-1 min-w-0 p-5 flex flex-col justify-between">
                    <div>
                        <div class="flex items-start justify-between gap-3 mb-2">
                            <h3 class="font-bold text-slate-900 text-lg leading-snug" th:text="${shop.name}">Nom de l'emplacement</h3>
                            <span class="shrink-0 inline-flex items-center gap-1.5 text-[11px] font-semibold px-2.5 py-1 rounded-full"
                                  th:classappend="${shop.statut.name() == 'DISPONIBLE'} ? 'bg-green-50 text-green-700' : (${shop.statut.name() == 'NON_DISPONIBLE'} ? 'bg-red-50 text-red-700' : 'bg-orange-50 text-orange-700')">
                                <span class="w-1.5 h-1.5 rounded-full" th:classappend="${shop.statut.name() == 'DISPONIBLE'} ? 'bg-green-500' : (${shop.statut.name() == 'NON_DISPONIBLE'} ? 'bg-red-500' : 'bg-orange-500')"></span>
                                <span th:text="${shop.statut.name() == 'DISPONIBLE'} ? 'Disponible' : (${shop.statut.name() == 'NON_DISPONIBLE'} ? 'Non disponible' : 'En maintenance')">Disponible</span>
                            </span>
                        </div>
                        <div class="flex flex-wrap items-center gap-x-4 gap-y-1.5 text-xs text-slate-500">
                            <span class="flex items-center gap-1.5">
                                <span class="w-3.5 h-3.5 shrink-0" th:insert="~{fragments/icons :: building}"></span>
                                <span th:text="${#strings.capitalize(#strings.toLowerCase(shop.palier.name()).replace('_',' '))}">Palier 1</span>
                            </span>
                            <span class="flex items-center gap-1.5">
                                <span class="w-3.5 h-3.5 shrink-0" th:insert="~{fragments/icons :: tag}"></span>
                                <span th:text="${#strings.capitalize(#strings.toLowerCase(shop.categorie.name()))}">Boutique</span>
                            </span>
                            <span class="flex items-center gap-1.5">
                                <span class="w-3.5 h-3.5 shrink-0" th:insert="~{fragments/icons :: maximize}"></span>
                                <span th:text="${#numbers.formatDecimal(shop.superficie, 1, 'WHITESPACE', 0, 'COMMA')} + ' m²'">25 m²</span>
                            </span>
                        </div>
                    </div>

                    <div class="flex items-center justify-between pt-4 mt-3 border-t border-slate-100">
                        <span class="text-base font-extrabold text-slate-900" th:text="${#numbers.formatDecimal(shop.prix, 1, 'WHITESPACE', 0, 'COMMA')} + ' FCFA'">0 FCFA</span>
                        <a th:href="@{/shops/{id}(id=${shop.id})}" class="bg-slate-900 text-white text-xs font-semibold px-4 py-2 rounded-xl hover:bg-slate-800 transition-colors">
                            Gérer
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </div>

</main>

</body>
</html>
