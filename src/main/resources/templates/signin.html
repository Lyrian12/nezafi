<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - NEZAFI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#faf8f5] text-slate-800 antialiased min-h-screen flex items-center justify-center p-6">

<!-- Conteneur principal de la carte -->
<div class="bg-white max-w-md w-full p-8 md:p-10 rounded-2xl border border-slate-200 shadow-sm text-center">

    <!-- Logo pastilles de la maquette de connexion -->
    <div class="flex justify-center items-center space-x-1.5 mb-6">
        <span class="w-2.5 h-2.5 bg-lime-500 rounded-full"></span>
        <span class="w-2.5 h-2.5 bg-lime-500 rounded-full"></span>
    </div>

    <!-- En-tête -->
    <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight mb-1">Welcome Back</h1>
    <p class="text-xs text-slate-500 mb-8">Enter your credentials to access your portal</p>

    <!-- Formulaire de connexion Spring Security -->
    <form action="/signin" method="post" class="space-y-4 text-left">

        <!-- Message d'erreur éventuel -->
        <div th:if="${error}" class="p-3 bg-red-50 border border-red-100 text-red-600 text-xs rounded-xl">
            Invalid email or password. Please try again.
        </div>

        <!-- Email / Username -->
        <div>
            <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1.5">Email Address</label>
            <input type="email" name="username" placeholder="name@company.com" required
                   class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-slate-400 transition-colors">
        </div>

        <!-- Mot de passe -->
        <div>
            <div class="flex justify-between items-center mb-1.5">
                <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500">Password</label>
                <a href="/forgot-password" class="text-[11px] font-medium text-slate-400 hover:text-slate-700 transition-colors">Forgot password?</a>
            </div>
            <input type="password" name="password" placeholder="••••••••" required
                   class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-slate-400 transition-colors">
        </div>

        <!-- Bouton Sign In (Sombre élégant inspiré du dashboard) -->
        <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-3.5 rounded-xl transition-colors text-sm shadow-sm mt-2">
            Sign In
        </button>

    </form>

    <!-- Lien vers l'inscription -->
    <p class="text-center text-xs text-slate-500 mt-6">
        Don't have an account? <a href="/signup" class="font-bold text-slate-900 hover:underline">Sign up for free</a>
    </p>

</div>

</body>
</html>
