<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de bord - Gestion de Boutique</title>
    <!-- Tailwind CSS pour un design moderne -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#faf8f5] text-slate-800 antialiased min-h-screen flex flex-col">

<!-- NAVBAR (Logo à gauche, Sign Out à droite, rien au milieu) -->
<header class="w-full bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
    <!-- Logo à gauche -->
    <div class="flex items-center space-x-2">
        <span class="inline-block w-3 h-3 bg-lime-500 rounded-full"></span>
        <span class="font-bold text-lg tracking-wider text-slate-900">NEZAFI</span>
    </div>

    <!-- Sign out à la droite -->
    <div>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="text-sm font-medium text-slate-600 hover:text-slate-900 transition-colors">
                Sign Out
            </button>
        </form>
    </div>
</header>

<!-- CONTENU PRINCIPAL -->
<main class="flex-grow max-w-7xl w-full mx-auto px-6 py-8">

    <!-- En-tête de bienvenue en français -->
    <div class="mb-8">
        <p class="text-xs font-semibold tracking-wider text-slate-400 uppercase mb-1">Bienvenue</p>
        <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight" th:text="${username} + '.'">Votre Tableau de Bord.</h1>
    </div>

    <!-- SECTION DES STATISTIQUES GLOBALES -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Total Boutiques</p>
            <p class="text-3xl font-bold text-slate-900" th:text="${shops.size()}">01</p>
        </div>
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Commandes en Attente</p>
            <p class="text-3xl font-bold text-slate-900" th:text="${pendingRequestsCount}">0</p>
        </div>
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Statut Global</p>
            <p class="text-3xl font-bold text-lime-600">Actif</p>
        </div>
    </div>

    <!-- SECTION CENTRALE : LISTE DES BOUTIQUES -->
    <div class="space-y-6">
        <div class="flex items-center justify-between">
            <h2 class="text-xl font-bold text-slate-900">Vos Boutiques</h2>
            <span class="text-xs text-slate-400" th:text="'Affichage de ' + ${shops.size()} + ' boutique(s)'">Affichage de 1 boutique</span>
        </div>

        <!-- Grille des boutiques connectée aux vraies données -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div th:each="shop : ${shops}" class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col justify-between hover:border-slate-300 transition-all">

                <!-- Image de la boutique -->
                <div class="h-40 w-full bg-slate-100 overflow-hidden relative">
                    <img th:src="${shop.imageUrl}" alt="Image de la boutique" class="w-full h-full object-cover">
                    <span class="absolute top-3 right-3 text-xs font-semibold px-2.5 py-1 rounded-full bg-white/90 backdrop-blur-sm text-slate-800 shadow-sm" th:text="${shop.statut}">DISPONIBLE</span>
                </div>

                <!-- Informations textuelles -->
                <div class="p-6 flex flex-col flex-grow justify-between">
                    <div>
                        <h3 class="font-bold text-slate-900 text-lg mb-1" th:text="${shop.name}">Nom de la boutique</h3>
                        <p class="text-xs text-slate-400 mb-4">
                            Ajoutée le : <span th:text="${#temporals.format(shop.addedAt, 'dd-MM-yyyy HH:mm')}">26-08-2026 05:02</span>
                        </p>
                    </div>

                    <div class="flex items-center justify-between pt-4 border-t border-slate-100 mt-2">
                        <span class="text-xs font-medium text-slate-500" th:text="'ID: ' + ${shop.id}">ID: 1</span>
                        <a th:href="@{/shops/{id}(id=${shop.id})}" class="bg-slate-900 text-white text-xs font-semibold px-4 py-2 rounded-xl hover:bg-slate-800 transition-colors">
                            Gérer
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </div>

</main>

</body>
</html>
