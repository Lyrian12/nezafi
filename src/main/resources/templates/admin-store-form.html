<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Formulaire emplacement</title>
    <th:block th:replace="~{fragments/theme :: head}"></th:block>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased min-h-screen">

<div th:replace="~{fragments/admin-nav :: logoutDock}"></div>

<!-- CONTENU PRINCIPAL — carte centrée qui se présente comme un panneau ouvert
     par-dessus le tableau de bord (cf. ~{fragments/theme :: head} pour l'animation). -->
<main class="max-w-4xl mx-auto p-6 md:p-10 my-6 md:my-10 bg-white dark:bg-slate-900 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-800 animate-panel-in">
    <!-- Top bar -->
    <div class="flex justify-end items-center mb-8 gap-3">
        <div th:replace="~{fragments/admin-nav :: panelClose}"></div>
        <div th:replace="~{fragments/admin-nav :: globalSearch}"></div>
        <div th:replace="~{fragments/theme :: toggleButton}"></div>
    </div>

    <!-- En-tête -->
    <div class="mb-8">
        <a th:href="@{/admin/stores}" class="text-xs text-slate-400 dark:text-slate-500 font-medium hover:text-slate-600 dark:hover:text-slate-300">← Retour aux emplacements</a>
        <h1 class="text-3xl font-extrabold text-slate-900 dark:text-slate-100 tracking-tight mt-4" th:text="${emplacement.id == null} ? 'Ajouter un emplacement' : 'Modifier l\'emplacement'">Ajouter un emplacement</h1>
    </div>

    <!-- Formulaire -->
    <div class="max-w-2xl">
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm p-8">
            <form th:action="${emplacement.id == null} ? @{/admin/stores/add} : @{/admin/stores/edit/{id}(id=${emplacement.id})}" method="post" class="space-y-6">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <!-- Store Name -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">Nom de l'emplacement *</label>
                    <input type="text" name="name" th:value="${emplacement.name}" placeholder="Entrez le nom de l'emplacement" required
                           class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:border-slate-400 transition-colors">
                </div>

                <!-- Image URL -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">URL de l'image *</label>
                    <input type="url" name="imageUrl" th:value="${emplacement.imageUrl}" placeholder="https://exemple.com/image.jpg" required
                           class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:border-slate-400 transition-colors">
                </div>

                <!-- Status -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">Statut *</label>
                    <select name="statut" required class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-800 dark:text-slate-100 focus:outline-none focus:border-slate-400 transition-colors">
                        <option value="">Sélectionner un statut</option>
                        <option value="DISPONIBLE" th:selected="${emplacement.statut == 'DISPONIBLE'}">Disponible</option>
                        <option value="NON_DISPONIBLE" th:selected="${emplacement.statut == 'NON_DISPONIBLE'}">Non Disponible</option>
                        <option value="EN_MAINTENANCE" th:selected="${emplacement.statut == 'EN_MAINTENANCE'}">En Maintenance</option>
                    </select>
                </div>

                <!-- Floor / Palier -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">Palier *</label>
                    <select name="palier" required class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-800 dark:text-slate-100 focus:outline-none focus:border-slate-400 transition-colors">
                        <option value="">Sélectionner un palier</option>
                        <option value="PALIER_1" th:selected="${emplacement.palier == 'PALIER_1'}">Palier 1</option>
                        <option value="PALIER_2" th:selected="${emplacement.palier == 'PALIER_2'}">Palier 2</option>
                        <option value="PALIER_3" th:selected="${emplacement.palier == 'PALIER_3'}">Palier 3</option>
                    </select>
                </div>

                <!-- Surface Area -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">Superficie (m&sup2;) *</label>
                    <input type="number" name="superficie" th:value="${emplacement.superficie}" step="0.01" min="0" placeholder="ex : 25.00" required
                           class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:border-slate-400 transition-colors">
                </div>

                <!-- Price -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">Prix (FCFA) *</label>
                    <input type="number" name="prix" th:value="${emplacement.prix}" step="0.01" min="0" placeholder="ex : 150000.00" required
                           class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:border-slate-400 transition-colors">
                </div>

                <!-- Catégorie -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">Catégorie *</label>
                    <select name="categorie" required class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-800 dark:text-slate-100 focus:outline-none focus:border-slate-400 transition-colors">
                        <option value="">Sélectionner une catégorie</option>
                        <option value="BOUTIQUE" th:selected="${emplacement.categorie == 'BOUTIQUE'}">Boutique</option>
                        <option value="MAGASIN" th:selected="${emplacement.categorie == 'MAGASIN'}">Magasin</option>
                    </select>
                </div>

                <!-- Buttons -->
                <div class="flex gap-4 pt-4">
                    <button type="submit" class="bg-[#ccff00] hover:bg-[#b8e600] text-slate-900 font-bold py-3 px-6 rounded-xl transition-colors text-sm">
                        <span th:text="${emplacement.id == null} ? 'Créer l\'emplacement' : 'Modifier l\'emplacement'">Créer l'emplacement</span>
                    </button>
                    <a th:href="@{/admin/stores}" class="bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-900 dark:text-slate-100 font-bold py-3 px-6 rounded-xl transition-colors text-sm">
                        Annuler
                    </a>
                </div>

            </form>
        </div>
    </div>

</main>

</body>
</html>
