<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Formulaire contrat</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#faf8f5] text-slate-800 antialiased min-h-screen flex">

<!-- SIDEBAR -->
<aside class="w-64 bg-white border-r border-slate-200 flex flex-col justify-between p-6 fixed h-full z-10">
    <div>
        <!-- Logo -->
        <div class="flex items-center space-x-2 mb-10">
            <span class="inline-block w-3 h-3 bg-lime-500 rounded-full"></span>
            <span class="font-bold text-lg tracking-wider text-slate-900">NEZAFI</span>
        </div>
        <!-- Navigation -->
        <nav class="space-y-1">
            <a th:href="@{/admin/stores}" class="flex items-center px-4 py-3 text-sm font-medium rounded-xl text-slate-600 hover:bg-slate-100 transition-colors">
                Gestion des boutiques
            </a>
            <a th:href="@{/admin/contracts}" class="flex items-center px-4 py-3 text-sm font-bold rounded-xl bg-slate-900 text-white">
                Gestion des contrats
            </a>
            <a th:href="@{/admin/clients}" class="flex items-center px-4 py-3 text-sm font-medium rounded-xl text-slate-600 hover:bg-slate-100 transition-colors">
                Gestion des clients
            </a>
        </nav>
    </div>
    <!-- Déconnexion -->
    <div>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="w-full text-left px-4 py-2 text-xs font-semibold text-red-600 hover:bg-red-50 rounded-xl transition-colors">
                Déconnexion
            </button>
        </form>
    </div>
</aside>

<!-- CONTENU PRINCIPAL -->
<main class="ml-64 flex-grow p-10">

    <!-- En-tête -->
    <div class="mb-8">
        <a th:href="@{/admin/contracts}" class="text-xs text-slate-400 font-medium hover:text-slate-600">← Retour aux contrats</a>
        <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight mt-4" th:text="${contrat.id == null} ? 'Ajouter un contrat' : 'Modifier le contrat'">Ajouter un contrat</h1>
    </div>

    <!-- Formulaire -->
    <div class="max-w-2xl">
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-8">
            <form th:action="${contrat.id == null} ? @{/admin/contracts/add} : @{/admin/contracts/edit/{id}(id=${contrat.id})}" method="post" class="space-y-6">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <!-- Store Selection -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Boutique *</label>
                    <select name="boutiqueId" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-800 focus:outline-none focus:border-slate-400 transition-colors">
                        <option value="">Sélectionner une boutique</option>
                        <option th:each="boutique : ${boutiques}"
                                th:value="${boutique.id}"
                                th:text="${boutique.name}"
                                th:selected="${contrat.boutique != null && contrat.boutique.id == boutique.id}">Nom de la boutique</option>
                    </select>
                </div>

                <!-- Start Date -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Date de début *</label>
                    <input type="date" name="dateDebut" th:value="${contrat.dateDebut}" required
                           class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-800 focus:outline-none focus:border-slate-400 transition-colors">
                </div>

                <!-- End Date -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Date de fin *</label>
                    <input type="date" name="dateFin" th:value="${contrat.dateFin}" required
                           class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-800 focus:outline-none focus:border-slate-400 transition-colors">
                </div>

                <!-- Terms -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Termes et conditions</label>
                    <textarea name="termes" th:text="${contrat.termes}" placeholder="Entrez les termes du contrat..." rows="4"
                           class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-slate-400 transition-colors"></textarea>
                </div>

                <!-- Status -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Statut *</label>
                    <select name="statut" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-800 focus:outline-none focus:border-slate-400 transition-colors">
                        <option value="">Sélectionner un statut</option>
                        <option value="EN_ATTENTE" th:selected="${contrat.statut == 'EN_ATTENTE'}">En Attente</option>
                        <option value="VALIDER" th:selected="${contrat.statut == 'VALIDER'}">Validé</option>
                        <option value="REJETER" th:selected="${contrat.statut == 'REJETER'}">Rejeté</option>
                        <option value="RESILIER" th:selected="${contrat.statut == 'RESILIER'}">Résilié</option>
                    </select>
                </div>

                <!-- Buttons -->
                <div class="flex gap-4 pt-4">
                    <button type="submit" class="bg-[#ccff00] hover:bg-[#b8e600] text-slate-900 font-bold py-3 px-6 rounded-xl transition-colors text-sm">
                        <span th:text="${contrat.id == null} ? 'Créer le contrat' : 'Modifier le contrat'">Créer le contrat</span>
                    </button>
                    <a th:href="@{/admin/contracts}" class="bg-slate-200 hover:bg-slate-300 text-slate-900 font-bold py-3 px-6 rounded-xl transition-colors text-sm">
                        Annuler
                    </a>
                </div>

            </form>
        </div>
    </div>

</main>

</body>
</html>
