<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe oublié - NEZAFI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Manrope', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } } };
    </script>
</head>
<body class="bg-[#faf8f5] text-slate-800 antialiased min-h-screen flex items-center justify-center p-6">

<div class="bg-white max-w-md w-full p-8 md:p-10 rounded-2xl border border-slate-200 shadow-sm text-center">

    <div class="flex justify-center items-center space-x-1.5 mb-6">
        <span class="w-2.5 h-2.5 bg-lime-500 rounded-full"></span>
        <span class="w-2.5 h-2.5 bg-lime-500 rounded-full"></span>
    </div>

    <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight mb-3">Mot de passe oublié</h1>
    <p class="text-sm text-slate-500 mb-8">
        Cette fonctionnalité arrive bientôt. En attendant, contactez le secrétariat pour réinitialiser votre accès.
    </p>

    <a th:href="@{/signin}" class="inline-block w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-3.5 rounded-xl transition-colors text-sm shadow-sm">
        Retour à la connexion
    </a>

</div>

</body>
</html>
