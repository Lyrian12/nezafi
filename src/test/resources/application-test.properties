# Config de test uniquement : H2 en mémoire, indépendante de toute instance PostgreSQL locale —
# mvn test doit pouvoir tourner sans base externe. N'hérite PAS de src/main/resources/application.
# properties pour le datasource (Spring Boot fusionne les deux fichiers, mais toute clé redéfinie
# ici prend le dessus) : Flyway est désactivé, Hibernate génère et détruit le schéma à chaque run.
spring.datasource.url=jdbc:h2:mem:nezafi-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
